<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12151A">
<meta name="description" content="Balance — lleva tu libro mayor personal de ingresos y gastos, sincronizado entre dispositivos.">
<title>Balance — Libro Mayor Personal</title>

<!-- PWA: instalable en móvil (Añadir a pantalla de inicio) -->
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Balance">
<link rel="icon" type="image/x-icon" href="icons/favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#12151A; --panel:#1B1F27; --panel-2:#20242D; --panel-3:#262b35;
    --paper:#F7F3E8; --paper-line:#E4DCC8; --ink:#23262E; --ink-soft:#5B5F68;
    --income:#2F7D5D; --income-soft:#DEEBE3; --expense:#AE2C40; --expense-soft:#F4DEE1;
    --gold:#C7A227; --gold-soft:#E9D48A; --muted:#9198A3; --border:#2C313B; --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{ scroll-behavior:smooth; }
  body{
    background:
      radial-gradient(1300px 650px at 12% -10%, rgba(199,162,39,.08), transparent 60%),
      radial-gradient(1000px 550px at 100% 0%, rgba(199,162,39,.05), transparent 55%),
      radial-gradient(800px 500px at 50% 100%, rgba(47,125,93,.04), transparent 60%),
      var(--bg);
    color:#E8E9EC; font-family:'Inter',sans-serif; min-height:100vh; font-size:15px;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:'Fraunces',serif; font-weight:600; margin:0; letter-spacing:-.3px; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  #app{ display:flex; min-height:100vh; }

  @keyframes fadeSlideIn{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes popIn{ from{ opacity:0; transform:scale(.94); } to{ opacity:1; transform:scale(1); } }
  .main-enter .page-head{ animation:fadeSlideIn .5s cubic-bezier(.2,.8,.2,1) both; }
  .main-enter .summary-row .summary-card{ animation:fadeSlideIn .5s cubic-bezier(.2,.8,.2,1) both; }
  .main-enter .summary-row .summary-card:nth-child(1){ animation-delay:.04s; }
  .main-enter .summary-row .summary-card:nth-child(2){ animation-delay:.11s; }
  .main-enter .summary-row .summary-card:nth-child(3){ animation-delay:.18s; }
  .main-enter .card{ animation:fadeSlideIn .55s cubic-bezier(.2,.8,.2,1) both; animation-delay:.16s; }
  .main-enter .mov-layout > *{ animation:fadeSlideIn .5s cubic-bezier(.2,.8,.2,1) both; }
  .main-enter .mov-layout > *:nth-child(2){ animation-delay:.08s; }
  .main-enter .cat-cols > .card{ animation:fadeSlideIn .5s cubic-bezier(.2,.8,.2,1) both; }
  .main-enter .cat-cols > .card:nth-child(2){ animation-delay:.08s; }

  .sidebar{ width:250px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border); padding:32px 20px; display:flex; flex-direction:column; gap:32px; }
  .brand{ display:flex; align-items:center; gap:12px; padding:0 6px; }
  .brand-mark{ width:42px; height:42px; border-radius:50%; border:2px double var(--gold); display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 4px 14px -6px rgba(199,162,39,.4); }
  .brand-mark span{ font-family:'Fraunces',serif; font-weight:700; color:var(--gold); font-size:18px; }
  .brand-text{ display:flex; flex-direction:column; gap:1px; }
  .brand .mark{ font-size:21px; letter-spacing:.2px; line-height:1.1; }
  .brand .sub{ font-size:10.5px; color:var(--muted); letter-spacing:1.3px; text-transform:uppercase; }
  nav.tabs{ display:flex; flex-direction:column; gap:4px; }
  .tab-btn{ display:flex; align-items:center; gap:13px; background:transparent; border:none; color:var(--muted); font-family:'Inter',sans-serif; font-size:14.5px; font-weight:500; padding:12px 14px; border-radius:11px; cursor:pointer; text-align:left; transition:background .18s, color .18s, transform .15s; }
  .tab-btn svg{ width:19px; height:19px; flex-shrink:0; opacity:.85; transition:transform .2s ease; }
  .tab-btn .dot{ display:none; }
  .tab-btn:hover{ background:var(--panel-2); color:#E8E9EC; }
  .tab-btn:hover svg{ transform:scale(1.12); }
  .tab-btn.active{ background:var(--panel-2); color:#fff; box-shadow:inset 3px 0 0 var(--gold); }
  .tab-btn.active svg{ opacity:1; color:var(--gold); }
  .tab-btn:active{ transform:scale(.97); }
  .tab-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  .sidebar-footer{ margin-top:auto; display:flex; flex-direction:column; gap:10px; }
  .sync-status{ display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--muted); padding:2px 6px; }
  .sync-dot{ width:7px; height:7px; border-radius:50%; background:var(--muted); flex-shrink:0; }
  .sync-status.saving .sync-dot{ background:var(--gold); animation:pulse 1s infinite ease-in-out; }
  .sync-status.saved .sync-dot{ background:var(--income); }
  .sync-status.error .sync-dot{ background:var(--expense); }
  .sync-status.error{ color:var(--expense); }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  .retry-link{ background:none; border:none; color:var(--expense); font-size:11px; text-decoration:underline; cursor:pointer; padding:0; }
  .currency-select{ background:var(--panel-2); color:#E8E9EC; border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; }
  .reset-link{ background:none; border:none; color:var(--muted); font-size:11.5px; text-align:left; cursor:pointer; padding:2px 6px; text-decoration:underline; }
  .reset-link:hover{ color:var(--expense); }

  main{ flex:1; padding:40px 48px; max-width:1240px; }
  .page-head{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:28px; gap:16px; flex-wrap:wrap; }
  .page-head h1{ font-size:30px; }
  .page-head p{ margin:5px 0 0; color:var(--muted); font-size:14px; }

  .btn{ position:relative; overflow:hidden; font-family:'Inter',sans-serif; font-weight:600; font-size:14px; border-radius:10px; padding:12px 20px; border:1px solid transparent; cursor:pointer; transition:transform .12s, opacity .15s, background .15s, box-shadow .15s; }
  .btn::after{ content:''; position:absolute; top:0; left:-60%; width:40%; height:100%; background:linear-gradient(120deg, transparent, rgba(255,255,255,.35), transparent); transform:skewX(-20deg); transition:left .5s ease; }
  .btn:hover::after{ left:130%; }
  .btn:active{ transform:scale(.96); }
  .btn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .btn-gold{ background:linear-gradient(180deg, var(--gold-soft), var(--gold)); color:#1C1B0F; box-shadow:0 6px 18px -6px rgba(199,162,39,.6); }
  .btn-gold:hover{ filter:brightness(1.06); transform:translateY(-1px); }
  .btn-ghost{ background:transparent; border-color:var(--border); color:#E8E9EC; }
  .btn-ghost:hover{ background:var(--panel-2); border-color:#3a4150; transform:translateY(-1px); }
  .btn-small{ padding:7px 12px; font-size:12.5px; }

  .card{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:26px; box-shadow:0 1px 0 rgba(255,255,255,.02) inset, 0 10px 30px -16px rgba(0,0,0,.5); transition:box-shadow .2s ease; }
  .card:hover{ box-shadow:0 1px 0 rgba(255,255,255,.02) inset, 0 14px 36px -14px rgba(0,0,0,.55); }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:0; position:relative; }
  .seam{ position:absolute; left:50%; top:8px; bottom:8px; width:1px; background:repeating-linear-gradient(to bottom, var(--border) 0 6px, transparent 6px 12px); transform:translateX(-50%); }
  .grid-2 > div{ padding:0 22px; }
  .grid-2 > div:first-child{ padding-left:0; }
  .grid-2 > div:last-child{ padding-right:0; }

  .summary-row{ display:grid; grid-template-columns:1.1fr 1fr 1fr; gap:20px; margin-bottom:24px; }
  .summary-card{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:22px 24px; box-shadow:0 10px 28px -16px rgba(0,0,0,.5); transition:transform .18s ease, box-shadow .18s ease; }
  .summary-card:hover{ transform:translateY(-3px); box-shadow:0 16px 34px -14px rgba(0,0,0,.6); }
  .summary-card .label{ font-size:12px; text-transform:uppercase; letter-spacing:1.3px; color:var(--muted); }
  .summary-card .value{ font-family:'IBM Plex Mono',monospace; font-size:26px; margin-top:10px; font-weight:600; }
  .value.income{ color:var(--income); }
  .value.expense{ color:var(--expense); }

  .stamp-wrap{ display:flex; align-items:center; justify-content:center; padding:32px 10px; }
  .stamp{ width:190px; height:190px; border-radius:50%; border:3px double currentColor; display:flex; flex-direction:column; align-items:center; justify-content:center; transform:rotate(-4deg); position:relative; filter:drop-shadow(0 8px 18px rgba(0,0,0,.38)); transition:transform .3s ease; }
  .stamp:hover{ transform:rotate(0deg) scale(1.03); }
  .stamp::before{ content:''; position:absolute; inset:10px; border:1px solid currentColor; border-radius:50%; opacity:.5; }
  .stamp .stamp-label{ font-size:11px; letter-spacing:2px; text-transform:uppercase; opacity:.85; font-family:'Inter',sans-serif; font-weight:600; }
  .stamp .stamp-value{ font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; margin-top:8px; text-align:center; padding:0 10px; }
  .stamp .stamp-sub{ font-size:10px; margin-top:7px; opacity:.7; font-family:'Inter',sans-serif;}

  h3.section-title{ font-size:14.5px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:16px; font-family:'Inter',sans-serif; font-weight:700; }

  .sub-tabs{ display:inline-flex; gap:8px; margin-bottom:22px; background:var(--panel-2); padding:4px; border-radius:11px; border:1px solid var(--border); }
  .sub-tabs button{ padding:9px 18px; border-radius:8px; border:none; background:transparent; color:var(--muted); font-weight:600; font-size:13.5px; cursor:pointer; transition:background .2s, color .2s; }
  .sub-tabs button.on{ background:var(--gold); color:#1C1B0F; box-shadow:0 3px 10px -3px rgba(199,162,39,.6); }

  .budget-list{ display:flex; flex-direction:column; gap:18px; margin-top:14px; }
  .budget-top{ display:flex; align-items:center; gap:9px; margin-bottom:8px; }
  .budget-name{ font-size:14px; font-weight:600; }
  .budget-amt{ margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--muted); }
  .budget-amt.over{ color:var(--expense); font-weight:700; }
  .budget-bar{ height:9px; border-radius:5px; background:var(--panel-2); overflow:hidden; }
  .budget-fill{ height:100%; width:0; background:linear-gradient(90deg,#3d9a72,var(--income)); border-radius:5px; transition:width .6s cubic-bezier(.2,.8,.2,1); }
  .budget-fill.over{ background:linear-gradient(90deg,#c8455c,var(--expense)); }
  .budget-fill.goal-done-fill{ background:linear-gradient(90deg,var(--gold-soft),var(--gold)); }

  .goal-card{ transition:transform .18s ease, box-shadow .18s ease; }
  .goal-card:hover{ transform:translateY(-2px); }
  .goal-card.done{ box-shadow:0 0 0 1px var(--gold) inset, 0 12px 30px -16px rgba(0,0,0,.5); }
  .goal-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .goal-actions{ display:flex; gap:8px; margin-top:4px; }

  .rec-row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .rec-toggle{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); margin-left:auto; }
  .banner-warn{ display:flex; align-items:center; gap:10px; background:var(--expense-soft); color:var(--expense); border-radius:11px; padding:12px 16px; margin-bottom:20px; font-size:13.5px; font-weight:600; cursor:pointer; transition:transform .15s; }
  .banner-warn:hover{ transform:translateY(-1px); }

  .bars{ display:flex; align-items:flex-end; gap:16px; height:170px; padding-top:10px; }
  .bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; height:100%; justify-content:flex-end; }
  .bar-pair{ display:flex; gap:4px; align-items:flex-end; height:100%; width:100%; justify-content:center; }
  .bar{ width:14px; border-radius:4px 4px 0 0; min-height:2px; transition:height .5s cubic-bezier(.2,.8,.2,1); }
  .bar.inc{ background:linear-gradient(180deg, #3d9a72, var(--income)); }
  .bar.exp{ background:linear-gradient(180deg, #c8455c, var(--expense)); }
  .bar-label{ font-size:11px; color:var(--muted); font-family:'IBM Plex Mono',monospace; }

  .donut-row{ display:flex; align-items:center; gap:28px; }
  .donut{ width:150px; height:150px; border-radius:50%; flex-shrink:0; box-shadow: inset 0 0 0 30px var(--panel), 0 10px 24px -12px rgba(0,0,0,.5); }
  .legend{ display:flex; flex-direction:column; gap:9px; font-size:13px; }
  .legend-item{ display:flex; align-items:center; gap:9px; }
  .legend-swatch{ width:11px; height:11px; border-radius:3px; flex-shrink:0; }
  .legend-amt{ margin-left:auto; font-family:'IBM Plex Mono',monospace; color:var(--muted); padding-left:16px; }
  .empty-note{ color:var(--muted); font-size:13.5px; padding:22px 0; }

  .mov-layout{ display:grid; grid-template-columns:320px 1fr; gap:24px; align-items:start; }
  .form-card{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:22px; position:sticky; top:20px; box-shadow:0 10px 28px -16px rgba(0,0,0,.5); }
  .form-card h3{ font-size:16.5px; margin-bottom:16px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11.5px; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.5px; }
  .field input, .field select, .field textarea{ width:100%; background:var(--panel-2); border:1px solid var(--border); color:#E8E9EC; border-radius:9px; padding:10px 12px; font-family:'Inter',sans-serif; font-size:14px; transition:border-color .15s, box-shadow .15s; }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(199,162,39,.18); }
  .type-toggle{ display:flex; gap:9px; margin-bottom:16px; }
  .type-toggle button{ flex:1; padding:10px; border-radius:9px; border:1px solid var(--border); background:var(--panel-2); color:var(--muted); font-weight:600; font-size:13.5px; cursor:pointer; transition:transform .12s, background .15s, border-color .15s; }
  .type-toggle button:hover{ transform:translateY(-1px); }
  .type-toggle button.on.ingreso{ background:var(--income-soft); color:var(--income); border-color:var(--income); }
  .type-toggle button.on.gasto{ background:var(--expense-soft); color:var(--expense); border-color:var(--expense); }
  .form-actions{ display:flex; gap:9px; margin-top:18px; }
  .form-actions .btn{ flex:1; }

  .filters-bar{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
  .filters-bar select, .filters-bar input{ background:var(--panel-2); border:1px solid var(--border); color:#E8E9EC; border-radius:9px; padding:9px 12px; font-size:13.5px; font-family:'Inter',sans-serif; transition:border-color .15s, box-shadow .15s; }
  .filters-bar select:focus, .filters-bar input:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(199,162,39,.18); }
  .filters-bar input[type=search]{ flex:1; min-width:140px; }
  .order-btn{ margin-left:auto; }

  .ledger{ background:var(--paper); color:var(--ink); border-radius:var(--radius); border:1px solid var(--paper-line); overflow:hidden; box-shadow:0 12px 34px -18px rgba(0,0,0,.55); }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  thead th{ text-align:left; padding:13px 16px; font-size:10.5px; text-transform:uppercase; letter-spacing:.8px; color:var(--ink-soft); border-bottom:1px solid var(--paper-line); background:#F0ECDF; }
  tbody tr{ border-bottom:1px solid var(--paper-line); transition:background .15s; }
  tbody tr:hover{ background:#EFE9D8; }
  tbody td{ padding:13px 16px; vertical-align:middle; }
  td.amt{ font-family:'IBM Plex Mono',monospace; font-weight:600; text-align:right; white-space:nowrap; }
  td.amt.inc{ color:var(--income); }
  td.amt.exp{ color:var(--expense); }
  td.bal{ font-family:'IBM Plex Mono',monospace; text-align:right; color:var(--ink-soft); white-space:nowrap; }
  .cat-pill{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; padding:4px 10px; border-radius:20px; font-weight:600; }
  .row-actions{ display:flex; gap:6px; justify-content:flex-end; }
  .icon-btn{ background:none; border:none; cursor:pointer; color:var(--ink-soft); font-size:15px; padding:4px 6px; border-radius:6px; transition:background .15s, color .15s, transform .12s; }
  .icon-btn:hover{ background:#E4DCC8; color:var(--ink); transform:scale(1.08); }
  .empty-ledger{ padding:56px 20px; text-align:center; color:var(--ink-soft); }
  .empty-ledger .big{ font-family:'Fraunces',serif; font-size:20px; color:var(--ink); margin-bottom:7px; }

  .cat-cols{ display:grid; grid-template-columns:1fr 1fr; gap:22px; }
  .cat-list{ display:flex; flex-direction:column; gap:9px; margin-top:14px; }
  .cat-row{ display:flex; align-items:center; gap:11px; background:var(--panel-2); border:1px solid var(--border); border-radius:10px; padding:11px 14px; transition:transform .15s, border-color .15s; }
  .cat-row:hover{ transform:translateX(3px); border-color:#3a4150; }
  .cat-swatch{ width:15px; height:15px; border-radius:5px; flex-shrink:0; }
  .cat-row span.name{ flex:1; font-size:14px; }
  .add-cat-form{ display:flex; gap:9px; margin-top:16px; }
  .add-cat-form input[type=text]{ flex:1; }
  .add-cat-form input[type=color]{ width:44px; padding:2px; height:40px; border-radius:8px; }

  footer.hint{ margin-top:36px; color:var(--muted); font-size:12.5px; text-align:center; }

  @keyframes pulseScale{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(1.08); opacity:.75; } }
  .loading-screen{ display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; width:100%; gap:16px; color:var(--muted); }
  .loading-screen .brand-mark{ width:48px; height:48px; animation:pulseScale 1.4s ease-in-out infinite; }
  .loading-screen .brand-mark span{ font-size:20px; }
  .spinner{ width:34px; height:34px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--gold); animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .error-screen{ display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; width:100%; gap:14px; color:var(--muted); text-align:center; padding:20px; }

  .auth-screen{ display:flex; align-items:center; justify-content:center; min-height:100vh; width:100%; padding:20px;
    background: radial-gradient(700px 420px at 50% 20%, rgba(199,162,39,.08), transparent 60%); }
  .auth-card{ width:100%; max-width:380px; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:36px 32px; box-shadow:0 24px 60px -20px rgba(0,0,0,.6); animation:popIn .4s cubic-bezier(.2,.8,.2,1) both; }
  .auth-card .brand{ padding:0; margin-bottom:24px; }
  .auth-card .mark{ font-size:26px; }
  .auth-tabs{ display:flex; gap:8px; margin-bottom:20px; background:var(--panel-2); padding:4px; border-radius:11px; border:1px solid var(--border); }
  .auth-tabs button{ flex:1; padding:10px; border-radius:8px; border:none; background:transparent; color:var(--muted); font-weight:600; font-size:13.5px; cursor:pointer; transition:background .2s, color .2s; }
  .auth-tabs button.on{ background:var(--gold); color:#1C1B0F; box-shadow:0 3px 10px -3px rgba(199,162,39,.6); }
  .auth-msg{ font-size:12.5px; margin-top:12px; padding:10px 12px; border-radius:9px; animation:fadeSlideIn .3s ease both; }
  .auth-msg.error{ background:var(--expense-soft); color:var(--expense); }
  .auth-msg.info{ background:var(--income-soft); color:var(--income); }
  .logout-link{ background:none; border:none; color:var(--muted); font-size:11.5px; cursor:pointer; padding:2px 6px; text-decoration:underline; }
  .logout-link:hover{ color:#E8E9EC; }

  @media (max-width: 880px){
    #app{ flex-direction:column; }
    .sidebar{ width:100%; flex-direction:row; align-items:center; padding:14px 18px; }
    .sidebar-footer{ margin-top:0; margin-left:auto; flex-direction:row; align-items:center; }
    main{ padding:20px; padding-bottom:96px; }
    .summary-row{ grid-template-columns:1fr; }
    .grid-2{ grid-template-columns:1fr; }
    .seam{ display:none; }

    .type-toggle button{ min-height:46px; }
    .filters-bar{ flex-direction:column; align-items:stretch; }
    .filters-bar select, .filters-bar input{ width:100%; }
    .order-btn{ margin-left:0; }
    .stamp{ width:140px; height:140px; }
    .donut-row{ flex-direction:column; align-items:flex-start; }
    .bars{ gap:8px; }
    .bar{ width:9px; }

    .ledger tbody tr{ display:grid; grid-template-columns:1fr auto; gap:4px 10px; background:#FCFAF3; border:1px solid var(--paper-line); border-radius:10px; padding:12px 14px; }
    .ledger tbody tr:hover{ background:#FCFAF3; }
    .ledger td{ padding:2px 0; border:none; }
    .ledger td.mono{ grid-column:1 / -1; font-size:11.5px; color:var(--ink-soft); order:-3; }
    .ledger td:nth-child(2){ order:-2; }

    .ledger td.amt{ text-align:left; font-size:15px; order:1; }
    .ledger td.bal{ text-align:right; align-self:center; order:1; font-size:12px; }
    .ledger td.bal::before{ content:'Saldo: '; }
    .ledger td:last-child{ grid-column:1 / -1; order:2; border-top:1px dashed var(--paper-line); margin-top:6px; padding-top:8px; }
    .row-actions{ justify-content:flex-start; }
    .icon-btn{ font-size:16px; padding:6px 10px; }
    .cat-row{ padding:11px 12px; }
    .add-cat-form{ flex-wrap:wrap; }
    .add-cat-form input[type=text]{ min-width:120px; }
    .sub-tabs{ display:flex; width:100%; overflow-x:auto; }
    .sub-tabs button{ flex:1; white-space:nowrap; padding:9px 10px; font-size:12.5px; }
    .budget-top{ flex-wrap:wrap; }
    .budget-amt{ margin-left:0; width:100%; order:3; }
    .rec-row{ flex-direction:column; align-items:flex-start; gap:6px; }
    .rec-toggle{ margin-left:0; }
    .banner-warn{ font-size:12.5px; }
  }
</style>
</head>
<body>
<div id="app"><div class="loading-screen"><div class="brand-mark"><span>B</span></div><div class="spinner"></div><div>Conectando…</div></div></div>

<script>
/* =====================================================================
   CONFIGURA AQUÍ TUS CREDENCIALES DE SUPABASE
   Las encuentras en tu proyecto: Project Settings -> API
   ===================================================================== */
const SUPABASE_URL = 'https://bjdmocfmddkzputiwekz.supabase.co';       // ej: https://xxxxxxxx.supabase.co
const SUPABASE_ANON_KEY = 'sb_publishable_RmBerLzYUv3ne12yoYBK3Q__mSzrvjZ';     // la "anon public" key

const supabaseClient = (SUPABASE_URL.startsWith('http'))
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

let currentUser = null;
let authMode = 'signin'; // 'signin' | 'signup'
let authMessage = null;  // {type:'error'|'info', text:''}

/* ---------- Estado y almacenamiento persistente (Supabase, sincroniza entre dispositivos) ---------- */
const STORAGE_KEY = 'app-state';

const defaultData = {
  currency: '$',
  categorias: [
    { id: 'c1', nombre: 'Salario', tipo: 'ingreso', color: '#2F7D5D' },
    { id: 'c2', nombre: 'Freelance', tipo: 'ingreso', color: '#4C9C7C' },
    { id: 'c3', nombre: 'Inversiones', tipo: 'ingreso', color: '#7CB89E' },
    { id: 'c4', nombre: 'Otros ingresos', tipo: 'ingreso', color: '#A9CFBD' },
    { id: 'c5', nombre: 'Alimentación', tipo: 'gasto', color: '#AE2C40' },
    { id: 'c6', nombre: 'Transporte', tipo: 'gasto', color: '#C1516A' },
    { id: 'c7', nombre: 'Vivienda', tipo: 'gasto', color: '#8E2233' },
    { id: 'c8', nombre: 'Servicios', tipo: 'gasto', color: '#D97E8F' },
    { id: 'c9', nombre: 'Ocio', tipo: 'gasto', color: '#C7A227' },
    { id: 'c10', nombre: 'Salud', tipo: 'gasto', color: '#B5406A' },
    { id: 'c11', nombre: 'Educación', tipo: 'gasto', color: '#8A5FA0' },
    { id: 'c12', nombre: 'Otros gastos', tipo: 'gasto', color: '#9198A3' },
  ],
  transacciones: [],
  // Presupuestos mensuales por categoría de gasto: { id, categoriaId, limite }
  presupuestos: [],
  // Metas de ahorro (llevan su propio progreso, independiente del saldo): { id, nombre, objetivo, ahorrado, creado }
  metas: [],
  // Movimientos recurrentes mensuales: { id, tipo, monto, categoriaId, nota, diaMes, activo, ultimaGeneracion, creado }
  recurrentes: [],
};

// state.data = lo que se persiste (currency, categorias, transacciones)
// el resto (pestaña activa, filtros, edición en curso) vive solo en memoria
let state = {
  data: null,
  loaded: false,
  loadError: false,
  syncStatus: 'idle', // idle | saving | saved | error
  currentTab: 'panel',
  planTab: 'presupuestos', // presupuestos | metas | recurrentes (dentro de Planificación)
  editingId: null,
  formTipo: 'ingreso',
  recFormTipo: 'gasto',
  filters: { tipo: 'todos', categoria: 'todas', mes: 'todos', q: '', orden: 'reciente' },
};

async function loadData(){
  try{
    const { data, error } = await supabaseClient
      .from('user_data')
      .select('data')
      .eq('user_id', currentUser.id)
      .maybeSingle();
    if(error) throw error;
    if(data && data.data && Object.keys(data.data).length){
      const parsed = data.data;
      state.data = Object.assign(structuredClone(defaultData), parsed, {
        categorias: parsed.categorias && parsed.categorias.length ? parsed.categorias : structuredClone(defaultData.categorias)
      });
    } else {
      state.data = structuredClone(defaultData);
      await supabaseClient.from('user_data').upsert({ user_id: currentUser.id, data: state.data });
    }
    state.loaded = true;
    processRecurrentes();
  }catch(e){
    console.error(e);
    state.data = structuredClone(defaultData);
    state.loaded = true;
    state.syncStatus = 'error';
  }
  render();
}

// Genera automáticamente los movimientos recurrentes cuyo día ya llegó y que no se hayan generado este mes.
function processRecurrentes(){
  if(!state.data.recurrentes || !state.data.recurrentes.length) return;
  const now = new Date();
  const curMonthKey = currentMonthKey();
  const todayDay = now.getDate();
  let changed = false;
  state.data.recurrentes.forEach(r=>{
    if(!r.activo) return;
    if(r.ultimaGeneracion === curMonthKey) return;
    const dia = Math.min(Math.max(1, r.diaMes || 1), 28);
    if(todayDay >= dia){
      const catValida = state.data.categorias.some(c=>c.id===r.categoriaId);
      if(!catValida) return;
      const fecha = new Date(now.getFullYear(), now.getMonth(), dia).toISOString().slice(0,10);
      state.data.transacciones.push({
        id: uid(), tipo: r.tipo, monto: r.monto, categoriaId: r.categoriaId, fecha,
        nota: r.nota ? r.nota + ' (automático)' : 'Movimiento recurrente', creado: Date.now()
      });
      r.ultimaGeneracion = curMonthKey;
      changed = true;
    }
  });
  if(changed) saveData();
}

let saveTimer = null;
function saveData(){
  state.syncStatus = 'saving';
  updateSyncBadge();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      const { error } = await supabaseClient
        .from('user_data')
        .upsert({ user_id: currentUser.id, data: state.data, updated_at: new Date().toISOString() });
      state.syncStatus = error ? 'error' : 'saved';
      if(error) console.error(error);
    }catch(e){
      console.error(e);
      state.syncStatus = 'error';
    }
    updateSyncBadge();
  }, 250);
}

function updateSyncBadge(){
  const el = document.getElementById('syncBadge');
  if(!el) return;
  el.className = 'sync-status ' + state.syncStatus;
  const label = { idle:'', saving:'Guardando…', saved:'Sincronizado', error:'Error al guardar' }[state.syncStatus];
  el.innerHTML = `<span class="sync-dot"></span><span>${label}</span>` + (state.syncStatus==='error' ? ` <button class="retry-link" id="retrySave">Reintentar</button>` : '');
  const retry = document.getElementById('retrySave');
  if(retry) retry.addEventListener('click', saveData);
}

function uid(){ return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ---------- Utilidades ---------- */
function fmt(n){
  const v = Number(n)||0;
  return state.data.currency + ' ' + v.toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function monthKey(dateStr){ return dateStr ? dateStr.slice(0,7) : ''; }
function monthLabel(key){
  const [y,m] = key.split('-');
  const names = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return names[parseInt(m,10)-1] + " '" + y.slice(2);
}
function catById(id){ return state.data.categorias.find(c=>c.id===id); }
function catsByTipo(tipo){ return state.data.categorias.filter(c=>c.tipo===tipo); }
function today(){ return new Date().toISOString().slice(0,10); }

function chronological(list){
  return list.slice().sort((a,b)=> a.fecha === b.fecha ? a.creado - b.creado : (a.fecha < b.fecha ? -1 : 1));
}
function withRunningBalance(){
  const asc = chronological(state.data.transacciones);
  let bal = 0;
  const map = {};
  asc.forEach(t=>{ bal += t.tipo === 'ingreso' ? t.monto : -t.monto; map[t.id] = bal; });
  return { map, finalBalance: bal };
}
function currentMonthKey(){ return today().slice(0,7); }
function monthTotals(key){
  let ing=0, gas=0;
  state.data.transacciones.forEach(t=>{
    if(monthKey(t.fecha) === key){ if(t.tipo==='ingreso') ing += t.monto; else gas += t.monto; }
  });
  return {ing, gas};
}
function lastMonths(n){
  const arr = []; const d = new Date(); d.setDate(1);
  for(let i=n-1;i>=0;i--){ const dd = new Date(d.getFullYear(), d.getMonth()-i, 1); arr.push(dd.toISOString().slice(0,7)); }
  return arr;
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- Render raíz ---------- */
function renderConfigMissing(){
  return `<div class="error-screen">
    <div style="font-size:20px; font-family:'Fraunces',serif;">Falta configurar Supabase</div>
    <div>Edita SUPABASE_URL y SUPABASE_ANON_KEY en el código antes de usar la app.</div>
  </div>`;
}

function renderAuth(){
  return `
  <div class="auth-screen">
    <div class="auth-card">
      <div class="brand" style="margin-bottom:22px;">
        <div class="brand-mark" style="width:38px;height:38px;"><span style="font-size:17px;">B</span></div>
        <div class="brand-text"><div class="mark" style="font-size:20px;">Balance</div><div class="sub">Libro mayor personal</div></div>
      </div>
      <div class="auth-tabs">
        <button data-authmode="signin" class="${authMode==='signin'?'on':''}">Iniciar sesión</button>
        <button data-authmode="signup" class="${authMode==='signup'?'on':''}">Crear cuenta</button>
      </div>
      <form id="authForm">
        <div class="field"><label for="authEmail">Correo</label><input type="email" id="authEmail" required autocomplete="email"></div>
        <div class="field"><label for="authPass">Contraseña</label><input type="password" id="authPass" required minlength="6" autocomplete="${authMode==='signin'?'current-password':'new-password'}"></div>
        <button type="submit" class="btn btn-gold" style="width:100%;margin-top:6px;">${authMode==='signin'?'Entrar':'Crear cuenta'}</button>
      </form>
      ${authMessage ? `<div class="auth-msg ${authMessage.type}">${authMessage.text}</div>` : ''}
    </div>
  </div>`;
}

let lastRenderedKey = null;

function render(){
  const app = document.getElementById('app');
  if(!supabaseClient){ app.innerHTML = renderConfigMissing(); return; }
  if(!currentUser){ app.innerHTML = renderAuth(); attachAuthEvents(); return; }
  if(!state.loaded){
    app.innerHTML = `<div class="loading-screen"><div class="brand-mark"><span>B</span></div><div class="spinner"></div><div>Cargando tu libro mayor…</div></div>`;
    return;
  }
  const renderKey = state.currentTab + (state.currentTab === 'planificacion' ? ':' + state.planTab : '');
  const tabChanged = renderKey !== lastRenderedKey;
  lastRenderedKey = renderKey;
  app.innerHTML = `
    ${renderSidebar()}
    <main class="${tabChanged ? 'main-enter' : ''}">
      ${state.currentTab === 'panel' ? renderPanel() : ''}
      ${state.currentTab === 'movimientos' ? renderMovimientos() : ''}
      ${state.currentTab === 'planificacion' ? renderPlanificacion() : ''}
      ${state.currentTab === 'categorias' ? renderCategorias() : ''}
      <footer class="hint">Tus datos se guardan en tu cuenta y se sincronizan automáticamente entre tus dispositivos.</footer>
    </main>
  `;
  attachEvents();
  updateSyncBadge();
  if(tabChanged) runEntranceAnimations();
}

function animateNumber(el, from, to, duration, formatter){
  if(!el) return;
  const start = performance.now();
  function step(now){
    const p = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = formatter(from + (to - from) * eased);
    if(p < 1) requestAnimationFrame(step);
    else el.textContent = formatter(to);
  }
  requestAnimationFrame(step);
}

function runEntranceAnimations(){
  if(state.currentTab === 'panel'){
    const stampEl = document.getElementById('balanceValue');
    if(stampEl){
      const target = parseFloat(stampEl.dataset.raw || '0');
      stampEl.textContent = fmt(0);
      animateNumber(stampEl, 0, target, 800, fmt);
    }
    document.querySelectorAll('.bar[data-h]').forEach((el, i) => {
      const h = el.dataset.h;
      el.style.height = '0px';
      el.style.transitionDelay = (i * 22) + 'ms';
      requestAnimationFrame(() => requestAnimationFrame(() => { el.style.height = h + 'px'; }));
    });
    const donut = document.querySelector('.donut');
    if(donut){
      donut.style.transition = 'none';
      donut.style.transform = 'scale(.55) rotate(-40deg)';
      donut.style.opacity = '0';
      requestAnimationFrame(() => requestAnimationFrame(() => {
        donut.style.transition = 'transform .65s cubic-bezier(.2,.8,.25,1.15), opacity .5s ease';
        donut.style.transform = 'scale(1) rotate(0deg)';
        donut.style.opacity = '1';
      }));
    }
  }
  if(state.currentTab === 'movimientos'){
    document.querySelectorAll('.ledger tbody tr').forEach((row, i) => {
      row.style.opacity = '0';
      row.style.transform = 'translateY(6px)';
      row.style.transition = 'opacity .35s ease, transform .35s ease';
      row.style.transitionDelay = (Math.min(i, 14) * 28) + 'ms';
      requestAnimationFrame(() => requestAnimationFrame(() => {
        row.style.opacity = '1';
        row.style.transform = 'translateY(0)';
      }));
    });
  }
  if(state.currentTab === 'categorias'){
    document.querySelectorAll('.cat-row').forEach((row, i) => {
      row.style.opacity = '0';
      row.style.transform = 'translateX(-6px)';
      row.style.transition = 'opacity .3s ease, transform .3s ease';
      row.style.transitionDelay = (Math.min(i, 14) * 24) + 'ms';
      requestAnimationFrame(() => requestAnimationFrame(() => {
        row.style.opacity = '1';
        row.style.transform = 'translateX(0)';
      }));
    });
  }
}

function renderSidebar(){
  const icons = {
    panel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="4" height="8"/><rect x="10" y="7" width="4" height="13"/><rect x="17" y="3" width="4" height="17"/></svg>',
    movimientos: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h18M3 16h18"/><path d="M7 8l-2 2 2 2M17 16l2-2-2-2"/></svg>',
    planificacion: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="0.6" fill="currentColor" stroke="none"/></svg>',
    categorias: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  };
  const tabs = [ {id:'panel', label:'Panel'}, {id:'movimientos', label:'Movimientos'}, {id:'planificacion', label:'Planificación'}, {id:'categorias', label:'Categorías'} ];
  return `
  <div class="sidebar">
    <div class="brand">
      <div class="brand-mark"><span>B</span></div>
      <div class="brand-text">
        <div class="mark">Balance</div>
        <div class="sub">Libro mayor</div>
      </div>
    </div>
    <nav class="tabs">
      ${tabs.map(t=>`<button class="tab-btn ${state.currentTab===t.id?'active':''}" data-tab="${t.id}">${icons[t.id]}<span>${t.label}</span></button>`).join('')}
    </nav>
    <div class="sidebar-footer">
      <span class="sync-status idle" id="syncBadge"><span class="sync-dot"></span></span>
      <select class="currency-select" id="currencySelect" aria-label="Moneda">
        ${['$','€','£','MX$','S/','$ (ARS)','$ (CLP)','R$'].map(c=>`<option value="${c}" ${state.data.currency===c?'selected':''}>${c}</option>`).join('')}
      </select>
      <button class="reset-link" id="resetBtn">Borrar todos los datos</button>
      <button class="logout-link" id="logoutBtn">Cerrar sesión (${currentUser.email})</button>
    </div>
  </div>`;
}

/* ---------- PANEL ---------- */
function renderPanel(){
  const { finalBalance } = withRunningBalance();
  const mk = currentMonthKey();
  const { ing, gas } = monthTotals(mk);
  const months = lastMonths(6);
  const monthData = months.map(m=>({m, ...monthTotals(m)}));
  const maxVal = Math.max(1, ...monthData.map(d=>Math.max(d.ing, d.gas)));

  const gastosPorCat = {};
  state.data.transacciones.forEach(t=>{
    if(t.tipo==='gasto' && monthKey(t.fecha)===mk){ gastosPorCat[t.categoriaId] = (gastosPorCat[t.categoriaId]||0) + t.monto; }
  });
  const catEntries = Object.entries(gastosPorCat).sort((a,b)=>b[1]-a[1]);
  const totalGastoMes = catEntries.reduce((s,[,v])=>s+v,0);
  let acc = 0;
  const gradientParts = catEntries.map(([cid,val])=>{
    const cat = catById(cid);
    const pct = totalGastoMes ? (val/totalGastoMes*100) : 0;
    const start = acc; acc += pct;
    return `${(cat?cat.color:'#888')} ${start}% ${acc}%`;
  });
  const donutStyle = catEntries.length ? `background: conic-gradient(${gradientParts.join(',')});` : `background:#3A3F4A;`;
  const stampColor = finalBalance >= 0 ? 'var(--income)' : 'var(--expense)';

  const excedidos = (state.data.presupuestos||[]).filter(p => (gastosPorCat[p.categoriaId]||0) > p.limite).length;

  return `
  <div class="page-head">
    <div><h1>Panel general</h1><p>Resumen de tu situación financiera</p></div>
    <button class="btn btn-gold" data-tab="movimientos">+ Nuevo movimiento</button>
  </div>
  ${excedidos>0 ? `<div class="banner-warn" data-tab="planificacion" data-plansub-jump="presupuestos">⚠ Te pasaste en ${excedidos} ${excedidos===1?'presupuesto':'presupuestos'} este mes — toca para revisarlos</div>` : ''}
  <div class="summary-row">
    <div class="summary-card">
      <div class="stamp-wrap" style="padding:4px 10px 0;">
        <div class="stamp" style="color:${stampColor};">
          <div class="stamp-label">Saldo actual</div>
          <div class="stamp-value mono" id="balanceValue" data-raw="${finalBalance}">${fmt(finalBalance)}</div>
          <div class="stamp-sub">Libro Mayor</div>
        </div>
      </div>
    </div>
    <div class="summary-card"><div class="label">Ingresos — este mes</div><div class="value income mono">${fmt(ing)}</div></div>
    <div class="summary-card"><div class="label">Gastos — este mes</div><div class="value expense mono">${fmt(gas)}</div></div>
  </div>
  <div class="card">
    <div class="grid-2">
      <div class="seam"></div>
      <div>
        <h3 class="section-title">Últimos 6 meses</h3>
        ${monthData.every(d=>d.ing===0 && d.gas===0) ? `<div class="empty-note">Aún no hay movimientos para graficar.</div>` : `
        <div class="bars">
          ${monthData.map(d=>`
            <div class="bar-col">
              <div class="bar-pair">
                <div class="bar inc" data-h="${(d.ing/maxVal*150).toFixed(1)}" style="height:${d.ing/maxVal*150}px" title="Ingresos ${fmt(d.ing)}"></div>
                <div class="bar exp" data-h="${(d.gas/maxVal*150).toFixed(1)}" style="height:${d.gas/maxVal*150}px" title="Gastos ${fmt(d.gas)}"></div>
              </div>
              <div class="bar-label">${monthLabel(d.m)}</div>
            </div>`).join('')}
        </div>`}
      </div>
      <div>
        <h3 class="section-title">Gastos por categoría (mes actual)</h3>
        ${catEntries.length===0 ? `<div class="empty-note">Sin gastos registrados este mes.</div>` : `
        <div class="donut-row">
          <div class="donut" style="${donutStyle}"></div>
          <div class="legend">
            ${catEntries.slice(0,6).map(([cid,val])=>{
              const cat = catById(cid);
              return `<div class="legend-item"><span class="legend-swatch" style="background:${cat?cat.color:'#888'}"></span><span>${cat?escapeHtml(cat.nombre):'Sin categoría'}</span><span class="legend-amt mono">${fmt(val)}</span></div>`;
            }).join('')}
          </div>
        </div>`}
      </div>
    </div>
  </div>`;
}

/* ---------- MOVIMIENTOS ---------- */
function renderMovimientos(){
  const editing = state.editingId ? state.data.transacciones.find(t=>t.id===state.editingId) : null;
  const formTipo = editing ? editing.tipo : (state.formTipo || 'ingreso');
  const cats = catsByTipo(formTipo);
  const { map } = withRunningBalance();
  let list = state.data.transacciones.slice();
  const f = state.filters;
  if(f.tipo !== 'todos') list = list.filter(t=>t.tipo===f.tipo);
  if(f.categoria !== 'todas') list = list.filter(t=>t.categoriaId===f.categoria);
  if(f.mes !== 'todos') list = list.filter(t=>monthKey(t.fecha)===f.mes);
  if(f.q.trim()) list = list.filter(t=>(t.nota||'').toLowerCase().includes(f.q.trim().toLowerCase()));
  list = chronological(list);
  if(f.orden === 'reciente') list.reverse();
  const mesesDisponibles = Array.from(new Set(state.data.transacciones.map(t=>monthKey(t.fecha)))).sort().reverse();

  return `
  <div class="page-head">
    <div><h1>Movimientos</h1><p>Registra y revisa cada ingreso y gasto</p></div>
    <button class="btn btn-ghost" id="exportBtn">Exportar CSV</button>
  </div>
  <div class="mov-layout">
    <div class="form-card">
      <h3>${editing ? 'Editar movimiento' : 'Nuevo movimiento'}</h3>
      <form id="txForm">
        <div class="type-toggle">
          <button type="button" data-formtipo="ingreso" class="${formTipo==='ingreso'?'on ingreso':''}">Ingreso</button>
          <button type="button" data-formtipo="gasto" class="${formTipo==='gasto'?'on gasto':''}">Gasto</button>
        </div>
        <div class="field"><label for="fMonto">Monto</label><input type="number" id="fMonto" step="0.01" min="0.01" required value="${editing?editing.monto:''}"></div>
        <div class="field"><label for="fCategoria">Categoría</label>
          <select id="fCategoria" required>${cats.map(c=>`<option value="${c.id}" ${editing && editing.categoriaId===c.id ? 'selected':''}>${escapeHtml(c.nombre)}</option>`).join('')}</select>
        </div>
        <div class="field"><label for="fFecha">Fecha</label><input type="date" id="fFecha" required value="${editing?editing.fecha:today()}"></div>
        <div class="field"><label for="fNota">Nota (opcional)</label><input type="text" id="fNota" maxlength="80" placeholder="Ej. supermercado, quincena..." value="${editing?(editing.nota||''):''}"></div>
        <div class="form-actions">
          <button type="submit" class="btn btn-gold">${editing?'Guardar cambios':'Agregar'}</button>
          ${editing ? `<button type="button" class="btn btn-ghost" id="cancelEdit">Cancelar</button>` : ''}
        </div>
      </form>
    </div>
    <div>
      <div class="filters-bar">
        <select id="filterTipo">
          <option value="todos" ${f.tipo==='todos'?'selected':''}>Todos los tipos</option>
          <option value="ingreso" ${f.tipo==='ingreso'?'selected':''}>Ingresos</option>
          <option value="gasto" ${f.tipo==='gasto'?'selected':''}>Gastos</option>
        </select>
        <select id="filterCategoria">
          <option value="todas" ${f.categoria==='todas'?'selected':''}>Todas las categorías</option>
          ${state.data.categorias.map(c=>`<option value="${c.id}" ${f.categoria===c.id?'selected':''}>${escapeHtml(c.nombre)}</option>`).join('')}
        </select>
        <select id="filterMes">
          <option value="todos" ${f.mes==='todos'?'selected':''}>Todos los meses</option>
          ${mesesDisponibles.map(m=>`<option value="${m}" ${f.mes===m?'selected':''}>${monthLabel(m)}</option>`).join('')}
        </select>
        <input type="search" id="filterQ" placeholder="Buscar en notas..." value="${f.q}">
        <button class="btn btn-ghost btn-small order-btn" id="orderBtn">${f.orden==='reciente' ? 'Reciente primero' : 'Antiguo primero'}</button>
      </div>
      <div class="ledger">
        ${list.length === 0 ? `<div class="empty-ledger"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="opacity:.4;margin-bottom:10px;"><path d="M4 4h16v16H4z"/><path d="M4 9h16M9 9v11"/></svg><div class="big">El libro está en blanco</div><div>Agrega tu primer movimiento desde el formulario de la izquierda.</div></div>` : `
        <table>
          <thead><tr><th>Fecha</th><th>Categoría</th><th>Nota</th><th style="text-align:right;">Monto</th><th style="text-align:right;">Saldo</th><th></th></tr></thead>
          <tbody>
            ${list.map(t=>{
              const cat = catById(t.categoriaId);
              return `<tr>
                <td class="mono">${t.fecha}</td>
                <td><span class="cat-pill" style="background:${cat?cat.color+'26':'#88888826'};color:${cat?cat.color:'#888'};">${cat?escapeHtml(cat.nombre):'—'}</span></td>
                <td>${t.nota ? escapeHtml(t.nota) : '<span style="color:var(--ink-soft)">—</span>'}</td>
                <td class="amt ${t.tipo==='ingreso'?'inc':'exp'}">${t.tipo==='ingreso'?'+':'−'} ${fmt(t.monto)}</td>
                <td class="bal">${fmt(map[t.id])}</td>
                <td><div class="row-actions"><button class="icon-btn" title="Editar" data-edit="${t.id}">✎</button><button class="icon-btn" title="Eliminar" data-del="${t.id}">✕</button></div></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>`}
      </div>
    </div>
  </div>`;
}

/* ---------- PLANIFICACIÓN: presupuestos, metas, recurrentes ---------- */
function renderPlanificacion(){
  const sub = state.planTab || 'presupuestos';
  return `
  <div class="page-head"><div><h1>Planificación</h1><p>Presupuestos por categoría, metas de ahorro y movimientos recurrentes</p></div></div>
  <div class="sub-tabs">
    <button data-plansub="presupuestos" class="${sub==='presupuestos'?'on':''}">Presupuestos</button>
    <button data-plansub="metas" class="${sub==='metas'?'on':''}">Metas de ahorro</button>
    <button data-plansub="recurrentes" class="${sub==='recurrentes'?'on':''}">Recurrentes</button>
  </div>
  ${sub === 'presupuestos' ? renderPresupuestos() : ''}
  ${sub === 'metas' ? renderMetas() : ''}
  ${sub === 'recurrentes' ? renderRecurrentes() : ''}
  `;
}

function renderPresupuestos(){
  const curKey = currentMonthKey();
  const gastoCats = catsByTipo('gasto');
  const presupuestos = state.data.presupuestos || [];
  const catsConPresupuesto = new Set(presupuestos.map(p=>p.categoriaId));
  const catsDisponibles = gastoCats.filter(c=>!catsConPresupuesto.has(c.id));
  const spend = {};
  state.data.transacciones.forEach(t=>{
    if(t.tipo==='gasto' && monthKey(t.fecha)===curKey){ spend[t.categoriaId] = (spend[t.categoriaId]||0) + t.monto; }
  });
  const excedidos = presupuestos.filter(p => (spend[p.categoriaId]||0) > p.limite).length;
  return `
  <div class="card" style="margin-bottom:20px;">
    ${excedidos>0 ? `<div class="auth-msg error" style="margin-bottom:16px;">Te pasaste en ${excedidos} ${excedidos===1?'categoría':'categorías'} este mes.</div>` : ''}
    <h3 class="section-title">Presupuestos de ${monthLabel(curKey)}</h3>
    ${presupuestos.length === 0 ? `<div class="empty-note">Aún no tienes presupuestos. Crea uno abajo para controlar cuánto gastas por categoría cada mes.</div>` : `
    <div class="budget-list">
      ${presupuestos.map(p=>{
        const cat = catById(p.categoriaId);
        const spent = spend[p.categoriaId]||0;
        const pct = Math.min(100, (spent/p.limite)*100);
        const over = spent > p.limite;
        return `<div class="budget-row">
          <div class="budget-top">
            <span class="cat-swatch" style="background:${cat?cat.color:'#888'}"></span>
            <span class="budget-name">${cat?escapeHtml(cat.nombre):'—'}</span>
            <span class="budget-amt ${over?'over':''}">${fmt(spent)} / ${fmt(p.limite)}</span>
            <button class="icon-btn" title="Eliminar presupuesto" data-delbudget="${p.id}">✕</button>
          </div>
          <div class="budget-bar"><div class="budget-fill ${over?'over':''}" style="width:${pct.toFixed(1)}%"></div></div>
        </div>`;
      }).join('')}
    </div>`}
  </div>
  <div class="card">
    <h3 class="section-title">Nuevo presupuesto</h3>
    ${catsDisponibles.length === 0 ? `<div class="empty-note">Ya tienes un presupuesto para todas tus categorías de gasto.</div>` : `
    <form id="addBudgetForm" style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;">
      <div class="field" style="flex:1;min-width:170px;margin-bottom:0;"><label>Categoría</label>
        <select id="budgetCat">${catsDisponibles.map(c=>`<option value="${c.id}">${escapeHtml(c.nombre)}</option>`).join('')}</select>
      </div>
      <div class="field" style="width:150px;margin-bottom:0;"><label>Límite mensual</label><input type="number" id="budgetLimite" step="0.01" min="0.01" required></div>
      <button type="submit" class="btn btn-gold">Agregar</button>
    </form>`}
  </div>`;
}

function renderMetas(){
  const metas = state.data.metas || [];
  return `
  <div class="cat-cols" style="grid-template-columns:1fr;gap:16px;">
    ${metas.length === 0 ? `<div class="card"><div class="empty-note">Aún no tienes metas de ahorro. Crea una abajo — por ejemplo "Vacaciones" o "Fondo de emergencia".</div></div>` : metas.map(m=>{
      const pct = Math.min(100, (m.ahorrado/m.objetivo)*100);
      const cumplida = m.ahorrado >= m.objetivo;
      return `<div class="card goal-card ${cumplida?'done':''}">
        <div class="goal-top">
          <div>
            <h3 style="font-size:17px;">${escapeHtml(m.nombre)} ${cumplida?'🏆':''}</h3>
            <div class="empty-note" style="padding:2px 0 0;">${fmt(m.ahorrado)} de ${fmt(m.objetivo)}</div>
          </div>
          <button class="icon-btn" title="Eliminar meta" data-delgoal="${m.id}">✕</button>
        </div>
        <div class="budget-bar" style="height:10px;margin:14px 0;"><div class="budget-fill ${cumplida?'goal-done-fill':''}" style="width:${pct.toFixed(1)}%"></div></div>
        <div class="goal-actions">
          <button class="btn btn-ghost btn-small" data-addfunds="${m.id}">+ Agregar ahorro</button>
        </div>
      </div>`;
    }).join('')}
  </div>
  <div class="card" style="margin-top:20px;">
    <h3 class="section-title">Nueva meta</h3>
    <form id="addGoalForm" style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;">
      <div class="field" style="flex:1;min-width:170px;margin-bottom:0;"><label>Nombre</label><input type="text" id="goalNombre" maxlength="40" required placeholder="Ej. Vacaciones"></div>
      <div class="field" style="width:150px;margin-bottom:0;"><label>Objetivo</label><input type="number" id="goalObjetivo" step="0.01" min="0.01" required></div>
      <button type="submit" class="btn btn-gold">Crear meta</button>
    </form>
  </div>`;
}

  <div class="card" style="margin-bottom:20px;">
    <h3 class="section-title">Tus movimientos recurrentes</h3>
    <div class="empty-note" style="padding:0 0 14px;">Se registran automáticamente la primera vez que abras la app en el día indicado (o después) de cada mes.</div>
    ${recs.length === 0 ? `<div class="empty-note">Aún no tienes movimientos recurrentes.</div>` : `
    <div class="cat-list">

          <span class="name">${escapeHtml(r.nota || (cat?cat.nombre:'Movimiento'))} · día ${r.diaMes} · <span class="mono" style="color:${r.tipo==='ingreso'?'var(--income)':'var(--expense)'};">${r.tipo==='ingreso'?'+':'−'} ${fmt(r.monto)}</span></span>
          <label class="rec-toggle"><input type="checkbox" data-togglerec="${r.id}" ${r.activo?'checked':''}> Activo</label>
          <button class="icon-btn" title="Eliminar" data-delrec="${r.id}">✕</button>

    <h3 class="section-title">Nuevo recurrente</h3>
    <form id="addRecForm">
      <div class="type-toggle">
        <button type="button" data-recformtipo="ingreso" class="${formTipo==='ingreso'?'on ingreso':''}">Ingreso</button>
        <button type="button" data-recformtipo="gasto" class="${formTipo==='gasto'?'on gasto':''}">Gasto</button>
      </div>
      <div class="field"><label for="recMonto">Monto</label><input type="number" id="recMonto" step="0.01" min="0.01" required></div>
      <div class="field"><label for="recCategoria">Categoría</label><select id="recCategoria" required>${cats.map(c=>`<option value="${c.id}">${escapeHtml(c.nombre)}</option>`).join('')}</select></div>
      <div class="field"><label for="recDia">Día del mes (1–28)</label><input type="number" id="recDia" min="1" max="28" value="1" required></div>
      <div class="field"><label for="recNota">Nota (opcional)</label><input type="text" id="recNota" maxlength="60" placeholder="Ej. Renta, Netflix..."></div>
      <button type="submit" class="btn btn-gold" style="width:100%;">Agregar recurrente</button>
    </form>
  </div>`;

/* ---------- CATEGORIAS ---------- */
function renderCategorias(){
  return `
  <div class="page-head"><div><h1>Categorías</h1><p>Organiza tus ingresos y gastos como prefieras</p></div></div>
  <div class="cat-cols">
    ${['ingreso','gasto'].map(tipo=>`
      <div class="card">
        <h3 class="section-title">${tipo==='ingreso'?'Categorías de ingreso':'Categorías de gasto'}</h3>
        <div class="cat-list">
          ${catsByTipo(tipo).map(c=>`
            <div class="cat-row">
              <span class="cat-swatch" style="background:${c.color}"></span>
              <span class="name">${escapeHtml(c.nombre)}</span>
              <button class="icon-btn" title="Eliminar" data-delcat="${c.id}">✕</button>
            </div>`).join('') || '<div class="empty-note">Sin categorías aún.</div>'}
        </div>
        <form class="add-cat-form" data-addcat="${tipo}">
          <input type="text" placeholder="Nueva categoría..." maxlength="30" required>
          <input type="color" value="${tipo==='ingreso'?'#4C9C7C':'#C1516A'}">
          <button type="submit" class="btn btn-ghost btn-small">Añadir</button>
        </form>
      </div>`).join('')}

}

/* ---------- Eventos ---------- */
function attachEvents(){
  document.querySelectorAll('[data-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.currentTab = btn.dataset.tab;
      state.editingId = null;
      state.formTipo = 'ingreso';
      if(btn.dataset.plansubJump) state.planTab = btn.dataset.plansubJump;
      render();
    });
  });

  const currencySelect = document.getElementById('currencySelect');
  if(currencySelect) currencySelect.addEventListener('change', e=>{ state.data.currency = e.target.value; saveData(); render(); });

  const resetBtn = document.getElementById('resetBtn');
  if(resetBtn) resetBtn.addEventListener('click', ()=>{
    if(confirm('Esto borrará todos tus movimientos y categorías personalizadas en todos tus dispositivos. ¿Continuar?')){
      state.data = structuredClone(defaultData);
      saveData(); render();
    }
  });

  document.querySelectorAll('[data-formtipo]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.formTipo = btn.dataset.formtipo; render(); });
  });

  const txForm = document.getElementById('txForm');
  if(txForm) txForm.addEventListener('submit', e=>{
    e.preventDefault();
    const monto = parseFloat(document.getElementById('fMonto').value);
    const categoriaId = document.getElementById('fCategoria').value;
    const fecha = document.getElementById('fFecha').value;
    const nota = document.getElementById('fNota').value.trim();
    const tipo = state.formTipo || 'ingreso';
    const catValida = state.data.categorias.some(c=>c.id===categoriaId && c.tipo===tipo);
    if(!monto || monto <= 0 || !categoriaId || !fecha || !catValida) return;
    if(state.editingId){
      const t = state.data.transacciones.find(x=>x.id===state.editingId);
      Object.assign(t, { monto, categoriaId, fecha, nota, tipo });
      state.editingId = null;
    } else {
      state.data.transacciones.push({ id: uid(), tipo, monto, categoriaId, fecha, nota, creado: Date.now() });
    }
    saveData(); render();
  });

  const cancelEdit = document.getElementById('cancelEdit');
  if(cancelEdit) cancelEdit.addEventListener('click', ()=>{ state.editingId = null; render(); });

  document.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const t = state.data.transacciones.find(x=>x.id===btn.dataset.edit);
      state.editingId = t.id; state.formTipo = t.tipo; render();
      document.getElementById('fMonto')?.focus();
    });
  });
  document.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(confirm('¿Eliminar este movimiento?')){
        state.data.transacciones = state.data.transacciones.filter(x=>x.id!==btn.dataset.del);
        saveData(); render();
      }
    });
  });

  const fTipo = document.getElementById('filterTipo');
  if(fTipo) fTipo.addEventListener('change', e=>{ state.filters.tipo = e.target.value; render(); });
  const fCat = document.getElementById('filterCategoria');
  if(fCat) fCat.addEventListener('change', e=>{ state.filters.categoria = e.target.value; render(); });
  const fMes = document.getElementById('filterMes');
  if(fMes) fMes.addEventListener('change', e=>{ state.filters.mes = e.target.value; render(); });
  const fQ = document.getElementById('filterQ');
  if(fQ) fQ.addEventListener('input', e=>{
    state.filters.q = e.target.value; render();
    const el = document.getElementById('filterQ');
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  });
  const orderBtn = document.getElementById('orderBtn');
  if(orderBtn) orderBtn.addEventListener('click', ()=>{ state.filters.orden = state.filters.orden === 'reciente' ? 'antiguo' : 'reciente'; render(); });

  const exportBtn = document.getElementById('exportBtn');
  if(exportBtn) exportBtn.addEventListener('click', exportCSV);

  document.querySelectorAll('[data-addcat]').forEach(form=>{
    form.addEventListener('submit', e=>{
      e.preventDefault();
      const tipo = form.dataset.addcat;
      const input = form.querySelector('input[type=text]');
      const color = form.querySelector('input[type=color]').value;
      const nombre = input.value.trim();
      if(!nombre) return;
      state.data.categorias.push({ id: uid(), nombre, tipo, color });
      saveData(); render();
    });
  });
  document.querySelectorAll('[data-delcat]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.delcat;
      const enUso = state.data.transacciones.some(t=>t.categoriaId===id)
        || (state.data.recurrentes||[]).some(r=>r.categoriaId===id)
        || (state.data.presupuestos||[]).some(p=>p.categoriaId===id);
      if(enUso){ alert('Esta categoría está en uso (en movimientos, presupuestos o recurrentes). Quítala de ahí antes de borrarla.'); return; }
      state.data.categorias = state.data.categorias.filter(c=>c.id!==id);
      saveData(); render();
    });
  });

  /* ---- Planificación: sub-tabs ---- */
  document.querySelectorAll('[data-plansub]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.planTab = btn.dataset.plansub; render(); });
  });

  /* ---- Presupuestos ---- */
  const addBudgetForm = document.getElementById('addBudgetForm');
  if(addBudgetForm) addBudgetForm.addEventListener('submit', e=>{
    e.preventDefault();
    const categoriaId = document.getElementById('budgetCat').value;
    const limite = parseFloat(document.getElementById('budgetLimite').value);
    if(!categoriaId || !limite || limite <= 0) return;
    state.data.presupuestos.push({ id: uid(), categoriaId, limite });
    saveData(); render();
  });
  document.querySelectorAll('[data-delbudget]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.data.presupuestos = state.data.presupuestos.filter(p=>p.id!==btn.dataset.delbudget);
      saveData(); render();
    });
  });

  /* ---- Metas de ahorro ---- */
  const addGoalForm = document.getElementById('addGoalForm');
  if(addGoalForm) addGoalForm.addEventListener('submit', e=>{
    e.preventDefault();
    const nombre = document.getElementById('goalNombre').value.trim();
    const objetivo = parseFloat(document.getElementById('goalObjetivo').value);
    if(!nombre || !objetivo || objetivo <= 0) return;
    state.data.metas.push({ id: uid(), nombre, objetivo, ahorrado: 0, creado: Date.now() });
    saveData(); render();
  });
  document.querySelectorAll('[data-delgoal]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(confirm('¿Eliminar esta meta de ahorro?')){
        state.data.metas = state.data.metas.filter(m=>m.id!==btn.dataset.delgoal);
        saveData(); render();
      }
    });
  });
  document.querySelectorAll('[data-addfunds]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const meta = state.data.metas.find(m=>m.id===btn.dataset.addfunds);
      if(!meta) return;
      const input = prompt(`¿Cuánto quieres agregar a "${meta.nombre}"?`, '');
      if(input === null) return;
      const monto = parseFloat(input);
      if(!monto || monto <= 0) return;
      meta.ahorrado += monto;
      saveData(); render();
    });
  });

  /* ---- Recurrentes ---- */
  document.querySelectorAll('[data-recformtipo]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.recFormTipo = btn.dataset.recformtipo; render(); });
  });
  const addRecForm = document.getElementById('addRecForm');
  if(addRecForm) addRecForm.addEventListener('submit', e=>{
    e.preventDefault();
    const tipo = state.recFormTipo || 'gasto';
    const monto = parseFloat(document.getElementById('recMonto').value);
    const categoriaId = document.getElementById('recCategoria').value;
    const diaMes = Math.min(28, Math.max(1, parseInt(document.getElementById('recDia').value, 10) || 1));
    const nota = document.getElementById('recNota').value.trim();
    const catValida = state.data.categorias.some(c=>c.id===categoriaId && c.tipo===tipo);
    if(!monto || monto <= 0 || !categoriaId || !catValida) return;
    state.data.recurrentes.push({ id: uid(), tipo, monto, categoriaId, nota, diaMes, activo: true, ultimaGeneracion: null, creado: Date.now() });
    saveData(); render();
  });
  document.querySelectorAll('[data-togglerec]').forEach(chk=>{
    chk.addEventListener('change', ()=>{
      const r = state.data.recurrentes.find(x=>x.id===chk.dataset.togglerec);
      if(r){ r.activo = chk.checked; saveData(); }
    });
  });
  document.querySelectorAll('[data-delrec]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(confirm('¿Eliminar este movimiento recurrente?')){
        state.data.recurrentes = state.data.recurrentes.filter(r=>r.id!==btn.dataset.delrec);
        saveData(); render();
      }
    });
  });
}

function exportCSV(){
  const rows = [['Fecha','Tipo','Categoría','Nota','Monto']];
  chronological(state.data.transacciones).forEach(t=>{
    const cat = catById(t.categoriaId);
    rows.push([t.fecha, t.tipo, cat?cat.nombre:'', (t.nota||'').replace(/"/g,'""'), t.monto]);
  });
  const csv = rows.map(r=>r.map(v=>`"${v}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `movimientos_${today()}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function attachAuthEvents(){
  document.querySelectorAll('[data-authmode]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ authMode = btn.dataset.authmode; authMessage = null; render(); });
  });
  const form = document.getElementById('authForm');
  if(form) form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPass').value;
    authMessage = null;
    try{
      if(authMode === 'signup'){
        const { data, error } = await supabaseClient.auth.signUp({ email, password });
        if(error) throw error;
        if(data.user && !data.session){
          authMessage = { type:'info', text:'Cuenta creada. Revisa tu correo para confirmar antes de entrar.' };
          render();
          return;
        }
      } else {
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if(error) throw error;
      }
      // onAuthStateChange se encarga de continuar el flujo
    }catch(err){
      authMessage = { type:'error', text: err.message || 'Ocurrió un error. Intenta de nuevo.' };
      render();
    }
  });
}

async function startApp(){
  if(!supabaseClient){ render(); return; }
  supabaseClient.auth.onAuthStateChange((_event, session)=>{
    const wasLoggedIn = !!currentUser;
    currentUser = session ? session.user : null;
    if(currentUser && !wasLoggedIn){
      state.loaded = false;
      loadData();
    } else if(!currentUser){
      state.loaded = false;
      state.data = null;
      render();
    }
  });
  const { data: { session } } = await supabaseClient.auth.getSession();
  currentUser = session ? session.user : null;
  if(currentUser){ await loadData(); } else { render(); }
}

document.addEventListener('click', (e)=>{
  if(e.target && e.target.id === 'logoutBtn'){
    supabaseClient.auth.signOut();
  }
});

startApp();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
